<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Livro</title>
    <link rel="stylesheet" href="style.css">

    <!-- MathJax para renderizar as equações -->
    <script>
        window.MathJax = {
            tex: {
              inlineMath: [['\\(', '\\)']],
              displayMath: [['\\[', '\\]']],
              tags: 'ams', 
              useLabelIds: true       
            }
        };
    </script>

    <script async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>

</head>

<body>
  <div id="book"></div>

  <script>
    const chapters = [
      "Chapters/chapter_1.html",
      "Chapters/chapter_2.html",
      "Chapters/chapter_3.html",
      "Chapters/chapter_10.html",
      "Chapters/chapter_14.html"
    ];

    let index = 0;
    let loading = false;

    // Ajusta alinhamento (curta = centro, longa = esquerda) e escala se ultrapassar a margem
    function adjustEquations(container) {
      const maxWidth = container.clientWidth || document.getElementById("book").clientWidth;
      const equations = container.querySelectorAll('mjx-container[display="true"]');

      equations.forEach(eq => {
        eq.style.fontSize = "";
        eq.style.textAlign = "left";

        const mathEl = eq.querySelector("mjx-math") || eq;
        const eqWidth = mathEl.scrollWidth;

        if (eqWidth <= maxWidth * 0.65) {
          eq.style.textAlign = "center";
        } else if (eqWidth <= maxWidth) {
          eq.style.textAlign = "left";
        } else {
          eq.style.textAlign = "left";
          const ratio = Math.max(0.72, (maxWidth / eqWidth) * 0.97);
          eq.style.fontSize = (ratio * 100).toFixed(1) + "%";
        }
      });
    }

    // Renderiza as equações só quando o MathJax terminou de carregar
    function renderMath(el) {
      const run = () => {
        if (window.MathJax && MathJax.typesetPromise) {
          MathJax.startup.promise = MathJax.startup.promise
            .then(() => MathJax.typesetPromise([el]))
            .then(() => adjustEquations(el))
            .catch(err => console.error("MathJax:", err));
        } else {
          setTimeout(run, 100);
        }
      };
      run();
    }

    // Recalcula se a janela for redimensionada ou girar o celular
    window.addEventListener("resize", () => {
      document.querySelectorAll(".chapter").forEach(adjustEquations);
    });

    function loadNextChapter() {
      if (loading || index >= chapters.length) return;
      loading = true;

      fetch(chapters[index])
        .then(res => {
          if (!res.ok) throw new Error(res.status + " " + chapters[index]);
          return res.text();
        })
        .then(html => {
          const book = document.getElementById("book");

          const parser = new DOMParser();
          const doc = parser.parseFromString(html, "text/html");

          const section = document.createElement("section");
          section.className = "chapter";
          section.innerHTML = doc.body ? doc.body.innerHTML : html;
          book.appendChild(section);

          const divider = document.createElement("div");
          divider.className = "divider";
          book.appendChild(divider);

          index++;

          // reprocessa e ajusta as equações só neste capítulo
          renderMath(section);
        })
        .catch(err => console.error("Erro ao carregar capítulo:", err))
        .finally(() => { loading = false; });
    }

    // carrega o primeiro capítulo
    loadNextChapter();

    // carrega mais quando o usuário chega perto do fim
    window.addEventListener("scroll", () => {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
        loadNextChapter();
      }
    });
  </script>
</body>
</html>
